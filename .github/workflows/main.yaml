name: PrihVPN Mega Split Update

on:
  schedule:
    - cron: '0 * * * *' # Авто-запуск каждый час
  workflow_dispatch:      # Кнопка для ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Права на запись в репозиторий для github-actions[bot]
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Process All Configs
        run: |
          set +e

          # 1. Очищаем целевые файлы
          touch white.json ros.json mifa.json
          echo -n "" > white.json
          echo -n "" > ros.json
          echo -n "" > mifa.json

          # Буферные файлы
          touch raw_white.txt temp_ros.txt temp_mifa.txt
          echo -n "" > raw_white.txt
          echo -n "" > temp_ros.txt
          echo -n "" > temp_mifa.txt

          # 2. Скачиваем источники
          curl -sL "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" -o raw_white.txt || touch raw_white.txt

          # Для ROS и MIFA маскируемся под v2rayN / Happ / Clash
          curl -sL -A "v2rayN/6.23" -H "Accept: */*" "https://m1xzoocrrs1nezbe.mxm-secure.online/" -o temp_ros.txt || touch temp_ros.txt
          curl -sL -A "v2rayN/6.23" -H "Accept: */*" "https://mifa.world/fast" -o temp_mifa.txt || touch temp_mifa.txt

          # 3. Шапки заголовков
          echo "#profile-update-interval: 1" > white.json
          echo "#profile-title: PrihVPN⚡ White" >> white.json
          echo "#announce: Все обновы в тг PrihsVPN!" >> white.json
          echo "" >> white.json

          echo "#profile-update-interval: 1" > ros.json
          echo "#profile-title: PrihVPN⚡ Ros" >> ros.json
          echo "#announce: Все обновы в тг PrihsVPN!" >> ros.json
          echo "" >> ros.json

          echo "#profile-update-interval: 1" > mifa.json
          echo "#profile-title: PrihVPN⚡ Mifa Full" >> mifa.json
          echo "#announce: Все обновы в тг PrihsVPN!" >> mifa.json
          echo "" >> mifa.json

          # 4. Парсинг WHITE (обычный чистый текст)
          if [ -s raw_white.txt ]; then
            grep -E -i "^(vless|trojan|ss|hysteria2)://" raw_white.txt | grep -v "0.0.0.0" >> white.json || true
          fi

          # 5. Универсальный парсинг ROS (декодирует и монолитный, и построчный Base64)
          if [ -s temp_ros.txt ]; then
            (base64 -d -i < temp_ros.txt 2>/dev/null || cat temp_ros.txt) | tr -d '\r' | awk -v RS='(vless|trojan|ss|hysteria2)://' 'NR>1 {print proto $0} {proto=RT}' | grep -E -i "^(vless|trojan|ss|hysteria2)://" | grep -v "0.0.0.0" >> ros.json || true
          fi

          # 6. Универсальный парсинг MIFA
          if [ -s temp_mifa.txt ]; then
            (base64 -d -i < temp_mifa.txt 2>/dev/null || cat temp_mifa.txt) | tr -d '\r' | awk -v RS='(vless|trojan|ss|hysteria2)://" 'NR>1 {print proto $0} {proto=RT}' | grep -E -i "^(vless|trojan|ss|hysteria2)://" | grep -v "0.0.0.0" >> mifa.json || true
          fi
          
          # 7. Очистка буфера
          rm -f raw_white.txt temp_ros.txt temp_mifa.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add white.json ros.json mifa.json
          git commit -m "Fix universal base64 parsing for ROS and MIFA" || echo "No changes to commit"
          git push origin main || git push --force

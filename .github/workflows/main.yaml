name: PrihVPN Mega Split Update

on:
  schedule:
    - cron: '0 * * * *' # Авто-запуск каждый час
  workflow_dispatch:      # Кнопка для ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Права на запись в репозиторий для github-actions[bot]
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and Process All Configs
        run: |
          python -c '
import urllib.request
import base64
import re

def parse_url(url, is_base64=False):
    headers = {"User-Agent": "v2rayN/6.23", "Accept": "*/*"}
    req = urllib.request.Request(url, headers=headers)
    
    try:
        with urllib.request.urlopen(req, timeout=15) as response:
            content = response.read().decode("utf-8", errors="ignore")
    except Exception as e:
        print(f"Error fetching {url}: {e}")
        return []

    lines = []
    
    if is_base64:
        # Сначала пробуем декодировать весь массив
        try:
            decoded = base64.b64decode(content.strip()).decode("utf-8", errors="ignore")
            lines.extend(decoded.splitlines())
        except Exception:
            # Если весь массив не декодировался, декодируем построчно
            for line in content.splitlines():
                line = line.strip()
                if not line:
                    continue
                try:
                    dec_line = base64.b64decode(line).decode("utf-8", errors="ignore")
                    lines.extend(dec_line.splitlines())
                except Exception:
                    lines.append(line)
    else:
        lines = content.splitlines()

    valid_configs = []
    proto_pattern = re.compile(r"^(vless|trojan|ss|hysteria2)://", re.IGNORECASE)

    for line in lines:
        line = line.strip()
        if proto_pattern.match(line) and "0.0.0.0" not in line:
            valid_configs.append(line)

    return valid_configs

def save_file(filename, title, configs):
    header = f"#profile-update-interval: 1\n#profile-title: {title}\n#announce: Все обновы в тг PrihsVPN!\n\n"
    with open(filename, "w", encoding="utf-8") as f:
        f.write(header)
        for cfg in configs:
            f.write(cfg + "\n")

# Process White
white_configs = parse_url("https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt", is_base64=False)
save_file("white.json", "PrihVPN⚡ White", white_configs)

# Process Ros
ros_configs = parse_url("https://m1xzoocrrs1nezbe.mxm-secure.online/", is_base64=True)
save_file("ros.json", "PrihVPN⚡ Ros", ros_configs)

# Process Mifa
mifa_configs = parse_url("https://mifa.world/fast", is_base64=True)
save_file("mifa.json", "PrihVPN⚡ Mifa Full", mifa_configs)
'

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add white.json ros.json mifa.json
          git commit -m "Update configs using Python parser" || echo "No changes to commit"
          git push origin main || git push --force

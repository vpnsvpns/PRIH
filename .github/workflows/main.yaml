name: PrihVPN Mega Split Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Process Configs
        run: |
          set +e

          # 1. Заголовки
          echo -e "#profile-update-interval: 1\n#profile-title: PrihVPN⚡ White\n#announce: Все обновы в тг PrihsVPN!\n" > white.json
          echo -e "#profile-update-interval: 1\n#profile-title: PrihVPN⚡ Ros\n#announce: Все обновы в тг PrihsVPN!\n" > ros.json
          echo -e "#profile-update-interval: 1\n#profile-title: PrihVPN⚡ Mifa Full\n#announce: Все обновы в тг PrihsVPN!\n" > mifa.json

          # 2. Скачивание с User-Agent Happ
          HAPP_UA="Happ/1.0.0 (iOS; sing-box 1.8.0)"

          curl -sL -A "$HAPP_UA" "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt" -o raw_white.txt
          curl -sL -A "$HAPP_UA" "https://m1xzoocrrs1nezbe.mxm-secure.online/" -o raw_ros.txt
          curl -sL -A "$HAPP_UA" "https://mifa.world/fast" -o raw_mifa.txt

          # 3. WHITE (обычный текст)
          if [ -s raw_white.txt ]; then
            tr -d '\r' < raw_white.txt | grep -E -i "^(vless|trojan|ss|hysteria2)://" | grep -v "0.0.0.0" >> white.json || true
          fi

          # 4. ROS (умный decode через openssl + нарезка слитых строк)
          if [ -s raw_ros.txt ]; then
            openssl base64 -d -A -in raw_ros.txt 2>/dev/null > decoded_ros.txt || cp raw_ros.txt decoded_ros.txt
            if ! grep -qE "vless://|trojan://|ss://|hysteria2://" decoded_ros.txt; then
              cp raw_ros.txt decoded_ros.txt
            fi
            tr -d '\r' < decoded_ros.txt \
              | sed -E 's/(vless:\/\/|trojan:\/\/|ss:\/\/|hysteria2:\/\/)/\n\1/g' \
              | grep -E -i "^(vless|trojan|ss|hysteria2)://" \
              | grep -v "0.0.0.0" >> ros.json || true
          fi

          # 5. MIFA (умный decode через openssl + нарезка слитых строк)
          if [ -s raw_mifa.txt ]; then
            openssl base64 -d -A -in raw_mifa.txt 2>/dev/null > decoded_mifa.txt || cp raw_mifa.txt decoded_mifa.txt
            if ! grep -qE "vless://|trojan://|ss://|hysteria2://" decoded_mifa.txt; then
              cp raw_mifa.txt decoded_mifa.txt
            fi
            tr -d '\r' < decoded_mifa.txt \
              | sed -E 's/(vless:\/\/|trojan:\/\/|ss:\/\/|hysteria2:\/\/)/\n\1/g' \
              | grep -E -i "^(vless|trojan|ss|hysteria2)://" \
              | grep -v "0.0.0.0" >> mifa.json || true
          fi

          # Чистка мусора
          rm -f raw_white.txt raw_ros.txt raw_mifa.txt decoded_ros.txt decoded_mifa.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add white.json ros.json mifa.json
          git commit -m "Update via openssl base64 decoder" || echo "No changes"
          git push origin main || git push --force

name: PrihVPN Mega Split Update

on:
  schedule:
    - cron: '0 * * * *'   # Авто-запуск каждый час
  workflow_dispatch:      # Кнопка для ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Права на запись в репозиторий для github-actions[bot]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Process All Configs
        run: |
          # Паттерн: ссылка от схемы ДО КОНЦА СТРОКИ,
          # чтобы название после # (с пробелами, флагами, кириллицей) сохранялось целиком
          RE="(vless|trojan|ss|hysteria2)://.*"

          # Универсальный парсер:
          # 1) открытые ссылки в тексте
          # 2) если пусто — весь файл как один base64
          # 3) если пусто — построчный base64
          parse_into() {
            src="$1"; dst="$2"; tmp="$3"
            : > "$tmp"
            tr -d '\r' < "$src" 2>/dev/null | grep -E -o -i "$RE" | grep -v "0.0.0.0" | sed 's/[[:space:]]*$//' | awk '!seen[$0]++' > "$tmp" || true
            if ! grep -q . "$tmp"; then
              base64 -d -i "$src" 2>/dev/null | tr -d '\r' | grep -E -o -i "$RE" | grep -v "0.0.0.0" | sed 's/[[:space:]]*$//' | awk '!seen[$0]++' > "$tmp" || true
            fi
            if ! grep -q . "$tmp"; then
              while IFS= read -r line || [ -n "$line" ]; do
                if [ -z "$line" ]; then continue; fi
                printf '%s\n' "$line" | tr -d '\r' | base64 -d -i 2>/dev/null | tr -d '\r' | grep -E -o -i "$RE" | grep -v "0.0.0.0" | sed 's/[[:space:]]*$//' >> "$tmp" || true
              done < "$src"
              (awk '!seen[$0]++' "$tmp" > "$tmp.dedup" && mv "$tmp.dedup" "$tmp") || true
            fi
            cat "$tmp" >> "$dst"
          }

          # 1. Создаем и принудительно очищаем целевые файлы и буферы
          : > white.json
          : > ros.json
          : > mifa.json
          : > raw_white.txt
          : > temp_ros.txt
          : > temp_mifa.txt
          : > tmp_links.txt

          # 2. Скачиваем источники — все три одинаковым обычным curl, без User-Agent
          curl -sL "https://gitverse.ru/api/repos/Akres/VPN/raw/branch/master/bwl" -o raw_white.txt || true
          curl -sL "https://gitverse.ru/api/repos/Akres/VPN/raw/branch/master/protocols/vless/transports/xhttp" -o temp_ros.txt || true
          curl -sL "https://gitverse.ru/api/repos/Akres/VPN/raw/branch/master/protocols/vless/transports/grpc" -o temp_mifa.txt || true

          # 3. Генерируем фирменные шапки БЕЗ таймстампов
          {
            echo "#profile-update-interval: 1"
            echo "#profile-title: PrihVPN⚡ White"
            echo "#announce: Все обновы в тг PrihsVPN!"
            echo ""
          } > white.json
          {
            echo "#profile-update-interval: 1"
            echo "#profile-title: PrihVPN⚡ Ros"
            echo "#announce: Все обновы в тг PrihsVPN!"
            echo ""
          } > ros.json
          {
            echo "#profile-update-interval: 1"
            echo "#profile-title: PrihVPN⚡ Mifa Full"
            echo "#announce: Все обновы в тг PrihsVPN!"
            echo ""
          } > mifa.json

          # 4. Парсим все три источника универсальным парсером
          parse_into raw_white.txt white.json tmp_links.txt
          parse_into temp_ros.txt  ros.json  tmp_links.txt
          parse_into temp_mifa.txt mifa.json tmp_links.txt

          # 5. Выметаем весь временный мусор
          rm -f raw_white.txt temp_ros.txt temp_mifa.txt tmp_links.txt

          # 6. Страховка: шаг всегда завершается с нулевым кодом
          exit 0

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add white.json ros.json mifa.json
          git commit -m "Mega Split Update (Clean Headers) $(date -u +%H:%M:%S)" || echo "No changes to commit"
          git push origin main || git push --force origin main

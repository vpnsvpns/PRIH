name: Parse MAX Subscription

on:
  schedule:
    - cron: '0 * * * *' # Каждый час
  workflow_dispatch:     # Запуск вручную

jobs:
  parse-max:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Parse MAX
        run: |
          set +e

          # 1. Формируем файл max.json с шапкой
          cat << 'EOF' > max.json
          #profile-update-interval: 1
          #profile-title: PrihVPN⚡ MAX
          #announce: Все обновы в тг PrihsVPN!

          EOF

          # 2. Качаем с полным набором заголовков Happ / sing-box
          # Если сервер проверяет User-Agent, это отдаст base64 подписку
          curl -sL \
            -A "Happ/1.0.0 (iOS; sing-box 1.8.0)" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: ru-RU,ru;q=0.9,en-US;q=0.8,en;q=0.7" \
            -H "Connection: keep-alive" \
            "https://m1xzoocrrs1nezbe.mxm-secure.online/" -o raw_max.txt

          # 3. Декодируем base64 и режем ссылки
          if [ -s raw_max.txt ]; then
            # Декодируем base64 (openssl съедает сплошной текст без переносов)
            openssl base64 -d -A -in raw_max.txt 2>/dev/null > decoded_max.txt || cp raw_max.txt decoded_max.txt
            
            # Проверяем: если декодер выдал пустоту или не ссылки, берем исходник
            if ! grep -qE "vless://|trojan://|ss://|hysteria2://" decoded_max.txt; then
              cp raw_max.txt decoded_max.txt
            fi

            # Разбиваем монолитную строку перед каждым протоколом и достаем ссылки
            tr -d '\r' < decoded_max.txt \
              | sed -E 's/(vless:\/\/|trojan:\/\/|ss:\/\/|hysteria2:\/\/)/\n\1/g' \
              | grep -E -i "^(vless|trojan|ss|hysteria2)://" \
              | grep -v "0.0.0.0" >> max.json || true
          fi

          # Чистим временные файлы
          rm -f raw_max.txt decoded_max.txt

      - name: Commit and Push max.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add max.json
          git commit -m "Update max.json" || echo "No changes to commit"
          git push origin main || git push --force
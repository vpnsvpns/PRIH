name: Parse MAX Subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  parse-max:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Parse MAX
        run: |
          set +e

          # 1. Шапка
          cat << 'EOF' > max.json
          #profile-update-interval: 1
          #profile-title: PrihVPN⚡ MAX
          #announce: Все обновы в тг PrihsVPN!

          EOF

          # 2. Переменные
          UUID="2cbc6c20-5439-493c-a3f2-e337b4d01b11"
          HWID="hd-bcc5e64a13f07e82"
          UA="Happ/5.4.0 (Google Pixel 8; Android 14; Scale/2.75) Xray/26.7.28"

          # 3. Запрос с эмуляцией зарегистрированного Pixel 8
          curl -sL --compressed \
            -A "$UA" \
            -H "User-Agent: $UA" \
            -H "X-User-Id: $UUID" \
            -H "X-Device-Id: $HWID" \
            -H "X-HWID: $HWID" \
            -H "X-Device-Model: Pixel 8" \
            -H "X-OS-Version: 14" \
            -H "Accept: */*" \
            "https://m1xzoocrRS1NeZbe.mxm-secure.online/${UUID}" -o raw_max.txt

          # Если основной путь пуст, пробуем роут /sub/
          if [ ! -s raw_max.txt ] || ! grep -qE "vless|trojan|ss|hysteria2|[A-Za-z0-9+/=]{20,}" raw_max.txt; then
            curl -sL --compressed \
              -A "$UA" \
              -H "User-Agent: $UA" \
              -H "X-User-Id: $UUID" \
              -H "X-Device-Id: $HWID" \
              -H "X-HWID: $HWID" \
              -H "X-Device-Model: Pixel 8" \
              -H "X-OS-Version: 14" \
              -H "Accept: */*" \
              "https://m1xzoocrRS1NeZbe.mxm-secure.online/sub/${UUID}" -o raw_max.txt
          fi

          # 4. Декодирование base64 и нарезка
          if [ -s raw_max.txt ]; then
            # Нормализация URL-safe Base64 (- на +, _ на /)
            sed -i 's/-/+/g; s/_/\//g' raw_max.txt

            # Пробуем декодировать openssl
            openssl base64 -d -A -in raw_max.txt 2>/dev/null > decoded_max.txt || cp raw_max.txt decoded_max.txt

            # Фоллбэк на утилиту base64
            if ! grep -qE "vless://|trojan://|ss://|hysteria2://" decoded_max.txt; then
              base64 -d raw_max.txt 2>/dev/null > decoded_max.txt || cp raw_max.txt decoded_max.txt
            fi

            # Если панель отдала открытый текст без base64
            if ! grep -qE "vless://|trojan://|ss://|hysteria2://" decoded_max.txt; then
              cp raw_max.txt decoded_max.txt
            fi

            # 5. Парсинг конфигов в файл
            tr -d '\r' < decoded_max.txt \
              | sed -E 's/(vless:\/\/|trojan:\/\/|ss:\/\/|hysteria2:\/\/)/\n\1/g' \
              | grep -E -i "^(vless|trojan|ss|hysteria2)://" \
              | grep -v "0.0.0.0" >> max.json || true
          fi

          rm -f raw_max.txt decoded_max.txt

      - name: Commit and Push max.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add max.json
          git commit -m "Parse MAX via Pixel 8 HWID" || echo "No changes"
          git push origin main || git push --force

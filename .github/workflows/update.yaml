name: parse-max

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch original body
        run: |
          python3 - <<'PY'
          import base64, json, re, subprocess, sys

          URL = "https://m1xzoocrRS1NeZbe.mxm-secure.online/"
          OUT = "max.json"

          NEW_HEAD = [
              "#profile-update-interval: 1",
              "#profile-title: PrihVPN⚡️ Max",
              "#announce: Все обновы в тг PrihsVPN!",
          ]

          COMBOS = [
              dict(ua="Happ/3.13.0", hwid="7bfa9b8f-d678-4e6d-8eec-1b0e795db16b", dos="Android", ver="15",     model="ELP-NX1"),
              dict(ua="Happ/3.13.0", hwid="ed4c60ee57dda4f8",                     dos="iOS",     ver="18.7.2", model="iPhone 14 Pro"),
              dict(ua="Happ/1.0",    hwid="7bfa9b8f-d678-4e6d-8eec-1b0e795db16b", dos="Android", ver="15",     model="ELP-NX1"),
              dict(ua="Happ/1.0",    hwid="ed4c60ee57dda4f8",                     dos="iOS",     ver="18.7.2", model="iPhone 14 Pro"),
          ]

          def fetch(c):
              cmd = ["curl", "-sS", "--compressed", "--max-time", "30",
                     "-H", f"User-Agent: {c['ua']}",
                     "-H", f"X-Hwid: {c['hwid']}",
                     "-H", f"X-Device-Os: {c['dos']}",
                     "-H", f"X-Ver-Os: {c['ver']}",
                     "-H", f"X-Device-Model: {c['model']}",
                     "-H", "X-Device-Locale: ru",
                     URL]
              return subprocess.run(cmd, capture_output=True, text=True)

          def unb64(t):
              lines = [l for l in t.splitlines() if l.strip()]
              if len(lines) != 1: return t
              s = lines[0].strip()
              if not re.fullmatch(r"[A-Za-z0-9+/=_-]{64,}", s): return t
              for alt in (s, s.replace("-", "+").replace("_", "/")):
                  try:
                      dec = base64.b64decode(alt + "=" * (-len(alt) % 4)).decode("utf-8", "ignore")
                  except Exception:
                      continue
                  if "://" in dec or dec.lstrip().startswith(("[", "#")):
                      return dec
              return t

          def split_body(t):
              """возвращает серверную часть КАК ЕСТЬ (список строк) или None"""
              low = t.lower()
              if "<html" in low or "<!doctype" in low or "документация" in low:
                  return None
              lines = t.splitlines()
              i = 0
              while i < len(lines) and lines[i].lstrip().startswith("#"):
                  i += 1                      # родные #комменты панели
              rest = lines[i:]
              joined = "\n".join(rest).strip()
              if not joined.startswith("["):  # оригинал = JSON-массив
                  return None
              try:
                  arr = json.loads(joined)
              except Exception:
                  return None
              if not isinstance(arr, list) or not arr:
                  return None
              return rest

          rest = None
          for c in COMBOS:
              r = fetch(c)
              if r.returncode != 0:
                  print("fetch fail:", r.stderr[:200]); continue
              rest = split_body(unb64(r.stdout))
              if rest is not None:
                  print("OK:", c["ua"], c["hwid"]); break
              print("не оригинал от", c["ua"])

          if rest is None:
              sys.exit("ERROR: не получил оригинальный JSON-массив от панели")

          while rest and not rest[0].strip():
              rest.pop(0)

          # 3 строчки шапки + серверный JSON байт-в-байт как в оригинале
          with open(OUT, "w", encoding="utf-8") as f:
              f.write("\n".join(NEW_HEAD + rest).rstrip() + "\n")
          print("wrote", OUT)
          PY

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add max.json
          if git diff --cached --quiet; then
            echo "без изменений"
          else
            git commit -m "max.json: auto update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

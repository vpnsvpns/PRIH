name: parse-max

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch & split
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess, sys

          URL = "https://m1xzoocrRS1NeZbe.mxm-secure.online/"
          OUT = "max.json"
          SERVERS_DIR = "."          # корень репы (как у тебя сейчас); хочешь папку — поставь "src"

          NEW_HEAD = [
              "#profile-update-interval: 1",
              "#profile-title: PrihVPN⚡️ Max",
              "#announce: Все обновы в тг PrihsVPN!",
          ]

          COMBOS = [
              dict(ua="Happ/3.13.0", hwid="7bfa9b8f-d678-4e6d-8eec-1b0e795db16b", dos="Android", ver="15",     model="ELP-NX1"),
              dict(ua="Happ/3.13.0", hwid="ed4c60ee57dda4f8",                     dos="iOS",     ver="18.7.2", model="iPhone 14 Pro"),
              dict(ua="Happ/1.0",    hwid="7bfa9b8f-d678-4e6d-8eec-1b0e795db16b", dos="Android", ver="15",     model="ELP-NX1"),
              dict(ua="Happ/1.0",    hwid="ed4c60ee57dda4f8",                     dos="iOS",     ver="18.7.2", model="iPhone 14 Pro"),
          ]

          def fetch(c):
              cmd = ["curl", "-sS", "--compressed", "--max-time", "30",
                     "-H", f"User-Agent: {c['ua']}",
                     "-H", f"X-Hwid: {c['hwid']}",
                     "-H", f"X-Device-Os: {c['dos']}",
                     "-H", f"X-Ver-Os: {c['ver']}",
                     "-H", f"X-Device-Model: {c['model']}",
                     "-H", "X-Device-Locale: ru",
                     URL]
              return subprocess.run(cmd, capture_output=True, text=True)

          def unb64(t):
              lines = [l for l in t.splitlines() if l.strip()]
              if len(lines) != 1: return t
              s = lines[0].strip()
              if not re.fullmatch(r"[A-Za-z0-9+/=_-]{64,}", s): return t
              for alt in (s, s.replace("-", "+").replace("_", "/")):
                  try:
                      dec = base64.b64decode(alt + "=" * (-len(alt) % 4)).decode("utf-8", "ignore")
                  except Exception:
                      continue
                  if dec.lstrip().startswith(("[", "#")) or "://" in dec:
                      return dec
              return t

          def extract_array(t):
              low = t.lower()
              if "<html" in low or "<!doctype" in low: return None
              lines = t.splitlines()
              i = 0
              while i < len(lines) and lines[i].lstrip().startswith("#"):
                  i += 1                      # скипаем #комменты панели
              rest = "\n".join(lines[i:]).strip()
              if not rest.startswith("["): return None
              try:
                  arr = json.loads(rest)
              except Exception:
                  return None
              if not isinstance(arr, list) or not arr: return None
              if not any(isinstance(x, dict) and "outbounds" in x for x in arr): return None
              return arr

          arr = None
          for c in COMBOS:
              r = fetch(c)
              if r.returncode != 0:
                  print("fetch fail:", r.stderr[:200]); continue
              a = extract_array(unb64(r.stdout))
              if a is not None:
                  arr = a; print("OK:", c["ua"], c["hwid"], "| серверов:", len(arr)); break
              print("не JSON от", c["ua"])

          if arr is None:
              sys.exit("ERROR: не удалось получить JSON-массив серверов")

          # --- чистим старые серверные json (нумерованные), чужие не трогаем ---
          if SERVERS_DIR not in (".", ""):
              os.makedirs(SERVERS_DIR, exist_ok=True)
          for f in os.listdir(SERVERS_DIR):
              if re.match(r"^\d+\.json$", f) or re.match(r"^\d{3}_.+\.json$", f):
                  os.remove(os.path.join(SERVERS_DIR, f))
                  print("removed old:", f)

          # --- каждый сервер в свой файл: 1.json, 2.json, ... ---
          n = 0
          for cfg in arr:
              if not isinstance(cfg, dict): continue
              n += 1
              with open(os.path.join(SERVERS_DIR, f"{n}.json"), "w", encoding="utf-8") as f:
                  json.dump(cfg, f, ensure_ascii=False, indent=2)

          # --- max.json: шапка + тот же JSON-массив серверов ---
          with open(OUT, "w", encoding="utf-8") as f:
              f.write("\n".join(NEW_HEAD) + "\n")
              json.dump(arr, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"done: серверов={n}, файлы 1.json..{n}.json, {OUT} обновлён")
          PY

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "без изменений"
          else
            git commit -m "max.json + servers: auto update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
